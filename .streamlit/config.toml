[theme]
base = "light"

# 主色调 - 专业深蓝
primaryColor = "#1a56db"

# 背景 - 高对比度白色系
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f8"
textColor = "#0f172a"

# 边框
borderColor = "#cbd5e1"

# 语义色
redColor = "#dc2626"
orangeColor = "#ea580c"
yellowColor = "#f59e0b"
greenColor = "#059669"
blueColor = "#1a56db"
violetColor = "#7c3aed"

# 字体 - Manrope（现代几何感）
font = "Manrope:sans-serif"

# 字号放大
baseFontSize = 17
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 500, 500, 400]

# 圆角
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#1a56db"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f8"
textColor = "#0f172a"

[theme.dark]
primaryColor = "#3b82f6"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f1f5f9"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false